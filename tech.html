<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnsiteDesk - Technician Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen py-6 px-4 relative">

  <div class="max-w-xl mx-auto space-y-4">
    <!-- TECH PROFILE -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-start">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold text-base" id="techInitial">T</div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg font-bold text-gray-900 leading-tight" id="techName">Loading...</h1>
              <span id="autoStatusPill" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-gray-200 text-gray-700">Checking status...</span>
            </div>
            <p class="text-xs text-gray-500 mt-0.5" id="techInfo">+60123456789 • All-Rounder</p>
          </div>
        </div>
        <button onclick="signOut()" class="text-xs font-medium text-red-600 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-lg">Sign Out</button>
      </div>
      <p class="text-[11px] text-gray-400 mt-4 border-t pt-3">* Status is updated automatically. 🔴 BUSY (Has active tasks) / 🟢 FREE (No task).</p>
    </div>

    <!-- TABS -->
    <div class="flex bg-white rounded-xl p-1 shadow-sm border border-gray-200 text-xs sm:text-sm font-semibold">
      <button onclick="switchTab('my')" id="tabMyBtn" class="w-1/3 py-2 rounded-lg bg-emerald-800 text-white transition">🎯 My Tasks (<span id="countMy">0</span>)</button>
      <button onclick="switchTab('pool')" id="tabPoolBtn" class="w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition">📥 Open Queue (<span id="countPool">0</span>)</button>
      <button onclick="switchTab('done')" id="tabDoneBtn" class="w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition">✅ History (<span id="countDone">0</span>)</button>
    </div>

    <div id="tasksContainer" class="space-y-3"></div>
  </div>

  <!-- POPUP MODAL UNTUK TECH -->
  <div id="resolveModal" class="hidden fixed inset-0 bg-gray-900/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 border border-gray-200">
      <h3 class="text-lg font-bold text-gray-900 mb-1">Resolve Ticket #<span id="resolveTicketIdText"></span></h3>
      <p class="text-xs text-gray-500 mb-5">Submit your resolution note and proof of completion to QM.</p>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Resolution Note *</label>
          <input type="text" id="modalNote" placeholder="e.g. Replaced power cable" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Proof Image (Optional)</label>
          <input type="file" id="modalFile" accept="image/*" class="w-full text-xs text-gray-600 file:bg-emerald-100 file:text-emerald-800 file:rounded file:border-0 file:px-3 file:py-1.5 file:mr-2 file:font-semibold">
        </div>
        
        <div class="flex gap-2 mt-6 pt-2">
          <button onclick="closeResolveModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2.5 rounded-lg transition text-sm">Cancel</button>
          <button onclick="submitResolveModal()" id="modalSubmitBtn" class="flex-1 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2.5 rounded-lg transition text-sm">✅ Submit Proof</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const IMGBB_API_KEY = "90877a376ae59e92d6e47c3f1df562ae";
    const DB_URLS = ["https://onsitedesk-3833b-default-rtdb.asia-southeast1.firebasedatabase.app", "https://onsitedesk-3833b-default-rtdb.firebaseio.com"];
    let activeDbUrl = localStorage.getItem("firebaseActiveUrl") || DB_URLS[0];

    async function dbFetch(path, options = {}) {
      for (const baseUrl of [activeDbUrl, ...DB_URLS]) {
        try { const res = await fetch(`${baseUrl}${path}`, options); if (res.ok) { activeDbUrl = baseUrl; localStorage.setItem("firebaseActiveUrl", baseUrl); return await res.json(); } } catch (e) {}
      } throw new Error("Database error.");
    }

    let currentTech = null; let allTickets = []; let activeTab = "my"; let activeResolveTicketId = null; 
    const priorityRank = { "Urgent": 1, "Medium": 2, "Low": 3 };

    window.onload = async () => {
      const saved = localStorage.getItem("techSession");
      if (!saved) return window.location.href = "index.html";
      currentTech = JSON.parse(saved);
      document.getElementById("techName").innerText = currentTech.name;
      document.getElementById("techInitial").innerText = currentTech.name.charAt(0).toUpperCase();
      document.getElementById("techInfo").innerText = `+${currentTech.phone} • Tech`;
      await syncWorkspace(); setInterval(syncWorkspace, 4000);
    };

    async function syncWorkspace() {
      try {
        const ticketsData = await dbFetch(`/tickets.json`);
        allTickets = ticketsData ? Object.values(ticketsData) : [];
        renderTasks(); updateAutoStatus(); 
      } catch (e) {}
    }

    function updateAutoStatus() {
      const activeTasks = allTickets.filter(t => t.assignedTo && t.assignedTo.toLowerCase() === currentTech.name.toLowerCase() && t.status === "In progress").length;
      const pill = document.getElementById("autoStatusPill");
      if (activeTasks > 0) {
        pill.className = "text-[11px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-800 border border-red-200"; pill.innerText = "🔴 BUSY (On Task)";
      } else {
        pill.className = "text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200"; pill.innerText = "🟢 FREE (No Task)";
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById("tabMyBtn").className = tab === 'my' ? "w-1/3 py-2 rounded-lg bg-emerald-800 text-white transition" : "w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition";
      document.getElementById("tabPoolBtn").className = tab === 'pool' ? "w-1/3 py-2 rounded-lg bg-emerald-800 text-white transition" : "w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition";
      document.getElementById("tabDoneBtn").className = tab === 'done' ? "w-1/3 py-2 rounded-lg bg-emerald-800 text-white transition" : "w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition";
      renderTasks();
    }

    function renderTasks() {
      const myName = currentTech.name.toLowerCase();
      const myTasks = allTickets.filter(t => t.assignedTo && t.assignedTo.toLowerCase() === myName && t.status === "In progress").sort((a, b) => (priorityRank[a.urgency] || 99) - (priorityRank[b.urgency] || 99));
      const poolTasks = allTickets.filter(t => (!t.assignedTo || t.assignedTo === "UNASSIGNED") && t.status === "New").sort((a, b) => (priorityRank[a.urgency] || 99) - (priorityRank[b.urgency] || 99));
      const doneTasks = allTickets.filter(t => t.assignedTo && t.assignedTo.toLowerCase() === myName && (t.status === "Resolved" || t.status === "Completed")).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      document.getElementById("countMy").innerText = myTasks.length;
      document.getElementById("countPool").innerText = poolTasks.length;
      document.getElementById("countDone").innerText = doneTasks.length;

      const container = document.getElementById("tasksContainer");
      const list = activeTab === "my" ? myTasks : activeTab === "pool" ? poolTasks : doneTasks;

      if (list.length === 0) return container.innerHTML = `<div class="bg-white p-8 rounded-xl border text-center text-sm text-gray-400">No tickets found in this tab.</div>`;

      container.innerHTML = list.map((t, idx) => {
        const urgBadge = t.urgency === "Urgent" ? "bg-red-600 text-white" : t.urgency === "Medium" ? "bg-orange-500 text-white" : "bg-emerald-100 text-emerald-900";
        const statBadge = t.status === "In progress" ? "bg-amber-100 text-amber-800" 
                        : t.status === "Resolved" ? "bg-purple-100 text-purple-800" 
                        : t.status === "Completed" ? "bg-emerald-100 text-emerald-800" 
                        : "bg-blue-100 text-blue-800";
        
        return `
          <div class="bg-white p-5 rounded-xl border ${idx === 0 && activeTab === 'my' ? 'border-2 border-emerald-600' : 'border-gray-200'} shadow-sm space-y-3">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold px-2.5 py-0.5 rounded ${urgBadge}">${t.urgency.toUpperCase()}</span>
                <span class="text-xs font-bold text-gray-800">#${t.id}</span>
              </div>
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded ${statBadge}">${t.status}</span>
            </div>

            <div>
              <p class="text-sm font-bold text-emerald-900">${t.type} ${t.subCategory ? `(${t.subCategory})` : ''}</p>
              <div class="text-sm text-gray-800 bg-gray-50 p-3 rounded-lg border mt-1.5">
                <p>${t.details}</p>
                ${t.imageUrl ? `<a href="${t.imageUrl}" target="_blank" class="inline-flex items-center mt-2 text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-200">📷 Problem Image</a>` : ""}
              </div>
              
              ${t.resolutionNote ? `
                <div class="mt-2 p-2 bg-emerald-50 border border-emerald-100 rounded">
                  <p class="text-xs text-emerald-800">✅ <b>Note:</b> ${t.resolutionNote}</p>${t.proofImageUrl ? `<a href="${t.proofImageUrl}" target="_blank" class="inline-flex items-center mt-1 text-[11px] font-bold text-emerald-700 bg-white px-2 py-1 rounded border border-emerald-200">✅ Proof Image</a>` : ""}
                </div>
              ` : ''}
              
              <div class="text-[10px] text-gray-400 mt-2 flex flex-col gap-0.5">
                <span>Created: ${t.createdAt}</span>
                ${t.resolvedAt && t.resolvedAt !== "-" ? `<span>Resolved: ${t.resolvedAt}</span>` : ""}
              </div>
            </div>

            <div class="pt-2 border-t border-gray-100 flex flex-wrap justify-between items-center gap-2 text-xs">
              <div class="text-gray-500 w-full sm:w-auto mb-2 sm:mb-0">
                👤 Staff: <b class="text-gray-800">${t.name}</b> • <a href="https://wa.me/${t.phone}" target="_blank" class="text-emerald-700 font-semibold underline">💬 Chat</a>
              </div>

              <div class="w-full sm:w-auto">
                ${activeTab === "pool" ? `<button onclick="selfClaimTask('${t.id}')" class="bg-emerald-800 hover:bg-emerald-900 text-white font-semibold px-3 py-2 rounded-lg transition w-full">🙋‍♂️ Claim This Task</button>` : ""}
                ${activeTab === "my" ? `
                  ${t.status === "In progress" ? `
                    <button onclick="openResolveModal('${t.id}')" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold px-3 py-2 rounded-lg transition text-xs mt-2 shadow-sm">
                      ✅ Resolve & Submit Proof
                    </button>
                  ` : ""}
                ` : ""}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    async function selfClaimTask(ticketId) {
      await Promise.all([
        dbFetch(`/tickets/${ticketId}/assignedTo.json`, { method: "PUT", body: JSON.stringify(currentTech.name) }),
        dbFetch(`/tickets/${ticketId}/assignedPhone.json`, { method: "PUT", body: JSON.stringify(currentTech.phone) }),
        dbFetch(`/tickets/${ticketId}/status.json`, { method: "PUT", body: JSON.stringify("In progress") })
      ]);
      switchTab('my'); syncWorkspace();
    }

    function openResolveModal(ticketId) {
      activeResolveTicketId = ticketId; document.getElementById('resolveTicketIdText').innerText = ticketId;
      document.getElementById('modalNote').value = ""; document.getElementById('modalFile').value = "";
      document.getElementById('resolveModal').classList.remove('hidden'); 
    }

    function closeResolveModal() { activeResolveTicketId = null; document.getElementById('resolveModal').classList.add('hidden'); }

    async function submitResolveModal() {
      const ticketId = activeResolveTicketId; const ticket = allTickets.find(t => t.id === ticketId);
      const noteInput = document.getElementById('modalNote').value.trim(); const fileInput = document.getElementById('modalFile');
      const btn = document.getElementById('modalSubmitBtn');

      if (!noteInput) return alert("Please enter a resolution note before completing.");
      btn.innerText = "Uploading & Saving..."; btn.disabled = true;
      let proofUrl = "";

      if (fileInput.files.length > 0) {
        const formData = new FormData(); formData.append("image", fileInput.files[0]);
        try {
          const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: "POST", body: formData });
          const data = await res.json(); if(data.success) proofUrl = data.data.url;
        } catch(e) { alert("Image upload failed. Saving text note only."); }
      }

      const now = new Date();
      const resolvedTime = now.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
      
      const updates = [
        dbFetch(`/tickets/${ticketId}/status.json`, { method: "PUT", body: JSON.stringify("Resolved") }),
        dbFetch(`/tickets/${ticketId}/resolvedAt.json`, { method: "PUT", body: JSON.stringify(resolvedTime) }),
        dbFetch(`/tickets/${ticketId}/resolutionNote.json`, { method: "PUT", body: JSON.stringify(noteInput) }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/completedToday.json`, { method: "PUT", body: JSON.stringify((currentTech.completedToday || 0) + 1) })
      ];
      if (proofUrl) updates.push(dbFetch(`/tickets/${ticketId}/proofImageUrl.json`, { method: "PUT", body: JSON.stringify(proofUrl) }));

      await Promise.all(updates); syncWorkspace(); closeResolveModal();
      btn.innerText = "✅ Submit Proof"; btn.disabled = false;

      const waText = `✅ *TASK COMPLETED [#${ticketId}]*\nHi ${ticket.name}, your request has been resolved by ${currentTech.name}!\n\n🛠️ *Note:* ${noteInput}\n${proofUrl ? `🖼️ *Proof:* ${proofUrl}\n` : ""}Thank you.`;
      window.open(`https://wa.me/${ticket.phone}?text=${encodeURIComponent(waText)}`, "_blank");
    }
    function signOut() { localStorage.removeItem("techSession"); window.location.href = "index.html"; }
  </script>
</body>
</html>
