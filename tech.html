<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnsiteDesk - Technician Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen py-6 px-4">

  <div class="max-w-xl mx-auto space-y-4">
    
    <!-- ================= 1. TECH PROFILE & AVAILABILITY CONTROL ================= -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-start pb-4 mb-4 border-b border-gray-100">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-slate-800 text-white flex items-center justify-center font-bold text-base" id="techInitial">
            T
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg font-bold text-gray-900 leading-tight" id="techName">Loading...</h1>
              <span id="liveStatusPill" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
                🟢 AVAILABLE
              </span>
            </div>
            <p class="text-xs text-gray-500 mt-0.5" id="techInfo">+60123456789 • All-Rounder</p>
          </div>
        </div>
        <button onclick="signOut()" class="text-xs font-medium text-red-600 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-lg">
          Sign Out
        </button>
      </div>

      <!-- 3 Availability Toggle Buttons -->
      <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
        Set My Status (Locks/Unlocks Your Name on QM Page):
      </label>
      <div class="grid grid-cols-3 gap-2 text-xs sm:text-sm font-semibold mb-3">
        <button onclick="setAvailability('Available', 'Ready for task')" id="btn-Available"
          class="avail-btn py-2.5 px-2 rounded-lg border text-center transition">
          🟢 Available
        </button>
        <button onclick="setAvailability('Busy')" id="btn-Busy"
          class="avail-btn py-2.5 px-2 rounded-lg border text-center transition">
          🔴 Busy / Working
        </button>
        <button onclick="setAvailability('Away', 'On Break / Outstation')" id="btn-Away"
          class="avail-btn py-2.5 px-2 rounded-lg border text-center transition">
          ⚫ Break / Off
        </button>
      </div>

      <!-- Quick Reason Chips when Busy/Away + Custom Note Input -->
      <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-2">
        <div class="flex flex-wrap gap-1.5">
          <span class="text-[11px] text-gray-400 w-full">Quick status note for QM Leader:</span>
          <button type="button" onclick="quickNote('Available', 'Ready at Service Desk')" class="text-[11px] bg-white hover:bg-emerald-50 border px-2 py-0.5 rounded-full text-gray-700">🟢 Ready at Desk</button>
          <button type="button" onclick="quickNote('Busy', 'Handling walk-in customer')" class="text-[11px] bg-white hover:bg-red-50 border px-2 py-0.5 rounded-full text-gray-700">🔴 Walk-in Customer</button>
          <button type="button" onclick="quickNote('Busy', 'Outstation / External job')" class="text-[11px] bg-white hover:bg-red-50 border px-2 py-0.5 rounded-full text-gray-700">🔴 External Job</button>
          <button type="button" onclick="quickNote('Away', 'Lunch / Prayer Break')" class="text-[11px] bg-white hover:bg-gray-200 border px-2 py-0.5 rounded-full text-gray-700">⚫ Lunch / Prayer</button>
        </div>

        <div class="flex gap-2">
          <input type="text" id="statusNote" placeholder="Current activity or location..."
            class="flex-1 text-xs px-3 py-2 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
          <button onclick="saveCustomNote()" class="text-xs bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg font-medium shrink-0">
            Save Note
          </button>
        </div>
      </div>
    </div>

    <!-- ================= 2. TASK NAVIGATION TABS ================= -->
    <div class="flex bg-white rounded-xl p-1 shadow-sm border border-gray-200 text-xs sm:text-sm font-semibold">
      <button onclick="switchTab('my')" id="tabMyBtn" class="w-1/3 py-2 rounded-lg bg-emerald-800 text-white transition">
        🎯 My Tasks (<span id="countMy">0</span>)
      </button>
      <button onclick="switchTab('pool')" id="tabPoolBtn" class="w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition">
        📥 Open Queue (<span id="countPool">0</span>)
      </button>
      <button onclick="switchTab('done')" id="tabDoneBtn" class="w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition">
        ✅ Completed (<span id="countDone">0</span>)
      </button>
    </div>

    <!-- ================= 3. TASK LIST CONTAINER ================= -->
    <div id="tasksContainer" class="space-y-3">
      <p class="text-sm text-gray-400 text-center py-8">Syncing tasks from Firebase...</p>
    </div>

  </div>

  <script>
    const DB_URLS = [
      "https://onsitedesk-3833b-default-rtdb.asia-southeast1.firebasedatabase.app",
      "https://onsitedesk-3833b-default-rtdb.firebaseio.com"
    ];
    let activeDbUrl = localStorage.getItem("firebaseActiveUrl") || DB_URLS[0];

    async function dbFetch(path, options = {}) {
      for (const baseUrl of [activeDbUrl, ...DB_URLS]) {
        try {
          const res = await fetch(`${baseUrl}${path}`, options);
          if (res.ok) {
            activeDbUrl = baseUrl;
            localStorage.setItem("firebaseActiveUrl", baseUrl);
            return await res.json();
          }
        } catch (e) {}
      }
      throw new Error("Database connection error.");
    }

    let currentTech = null;
    let allTickets = [];
    let activeTab = "my"; // 'my' | 'pool' | 'done'

    const priorityRank = { "Urgent": 1, "High": 2, "Normal": 3, "Low": 4 };

    window.onload = async () => {
      const saved = localStorage.getItem("techSession");
      if (!saved) {
        window.location.href = "index.html";
        return;
      }
      currentTech = JSON.parse(saved);
      updateProfileUI(currentTech);

      await syncWorkspace();
      setInterval(syncWorkspace, 4000);
    };

    function updateProfileUI(tech) {
      document.getElementById("techName").innerText = tech.name;
      document.getElementById("techInitial").innerText = tech.name.charAt(0).toUpperCase();
      document.getElementById("techInfo").innerText = `+${tech.phone} • ${tech.skill || 'Onsite Tech'}`;

      const status = tech.availability || "Available";
      const pill = document.getElementById("liveStatusPill");
      if (status === "Available") {
        pill.className = "text-[11px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800";
        pill.innerText = "🟢 AVAILABLE";
      } else if (status === "Busy") {
        pill.className = "text-[11px] font-bold px-2 py-0.5 rounded-full bg-red-100 text-red-800";
        pill.innerText = "🔴 BUSY (LOCKED)";
      } else {
        pill.className = "text-[11px] font-bold px-2 py-0.5 rounded-full bg-gray-200 text-gray-800";
        pill.innerText = "⚫ BREAK / OFF";
      }

      highlightAvailabilityBtn(status);
      if (document.activeElement.id !== "statusNote") {
        document.getElementById("statusNote").value = tech.statusNote || "";
      }
    }

    function highlightAvailabilityBtn(status) {
      document.querySelectorAll(".avail-btn").forEach(btn => {
        btn.className = "avail-btn py-2.5 px-2 rounded-lg border text-center bg-gray-50 text-gray-500 hover:bg-gray-100";
      });
      const activeBtn = document.getElementById("btn-" + status);
      if (!activeBtn) return;

      if (status === "Available") {
        activeBtn.className = "avail-btn py-2.5 px-2 rounded-lg border-2 border-emerald-600 bg-emerald-50 text-emerald-900 font-bold shadow-sm";
      } else if (status === "Busy") {
        activeBtn.className = "avail-btn py-2.5 px-2 rounded-lg border-2 border-red-600 bg-red-50 text-red-800 font-bold shadow-sm";
      } else {
        activeBtn.className = "avail-btn py-2.5 px-2 rounded-lg border-2 border-gray-700 bg-gray-200 text-gray-900 font-bold shadow-sm";
      }
    }

    async function syncWorkspace() {
      try {
        const [techData, ticketsData] = await Promise.all([
          dbFetch(`/onsiteTeam/${currentTech.phone}.json`),
          dbFetch(`/tickets.json`)
        ]);

        if (techData) {
          currentTech = techData;
          localStorage.setItem("techSession", JSON.stringify(techData));
          updateProfileUI(techData);
        }

        allTickets = ticketsData ? Object.values(ticketsData) : [];
        renderTasks();
      } catch (e) {
        console.error("Sync error:", e);
      }
    }

    // Set Availability & Note in Firebase (/onsiteTeam/{phone})
    async function setAvailability(newStatus, defaultNote = null) {
      const note = defaultNote !== null ? defaultNote : document.getElementById("statusNote").value.trim();
      await Promise.all([
        dbFetch(`/onsiteTeam/${currentTech.phone}/availability.json`, { method: "PUT", body: JSON.stringify(newStatus) }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/statusNote.json`, { method: "PUT", body: JSON.stringify(note) }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/lastUpdated.json`, { method: "PUT", body: JSON.stringify(Date.now()) })
      ]);
      syncWorkspace();
    }

    function quickNote(status, text) {
      document.getElementById("statusNote").value = text;
      setAvailability(status, text);
    }

    function saveCustomNote() {
      const note = document.getElementById("statusNote").value.trim();
      setAvailability(currentTech.availability || "Available", note);
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById("tabMyBtn").className = tab === 'my' ? "w-1/3 py-2 rounded-lg bg-emerald-800 text-white transition" : "w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition";
      document.getElementById("tabPoolBtn").className = tab === 'pool' ? "w-1/3 py-2 rounded-lg bg-emerald-800 text-white transition" : "w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition";
      document.getElementById("tabDoneBtn").className = tab === 'done' ? "w-1/3 py-2 rounded-lg bg-emerald-800 text-white transition" : "w-1/3 py-2 rounded-lg text-gray-600 hover:bg-gray-50 transition";
      renderTasks();
    }

    // Render Tasks Based on Selected Tab & Sorted by Priority
    function renderTasks() {
      const myName = currentTech.name.toLowerCase();

      // 1. My Active Tasks (Assigned to me & not Resolved)
      const myTasks = allTickets
        .filter(t => t.assignedTo && t.assignedTo.toLowerCase() === myName && t.status !== "Resolved")
        .sort((a, b) => (priorityRank[a.urgency] || 99) - (priorityRank[b.urgency] || 99));

      // 2. Unassigned Open Queue (So tech can self-claim if QM is busy)
      const poolTasks = allTickets
        .filter(t => (!t.assignedTo || t.assignedTo === "UNASSIGNED") && t.status === "New")
        .sort((a, b) => (priorityRank[a.urgency] || 99) - (priorityRank[b.urgency] || 99));

      // 3. My Completed Tasks
      const doneTasks = allTickets
        .filter(t => t.assignedTo && t.assignedTo.toLowerCase() === myName && t.status === "Resolved")
        .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      document.getElementById("countMy").innerText = myTasks.length;
      document.getElementById("countPool").innerText = poolTasks.length;
      document.getElementById("countDone").innerText = doneTasks.length;

      const container = document.getElementById("tasksContainer");
      const list = activeTab === "my" ? myTasks : activeTab === "pool" ? poolTasks : doneTasks;

      if (list.length === 0) {
        const emptyMsg = activeTab === "my" ? "🎉 You have no active tasks assigned right now."
                       : activeTab === "pool" ? "No unassigned requests waiting in the queue."
                       : "No completed tasks recorded yet.";
        container.innerHTML = `<div class="bg-white p-8 rounded-xl border text-center text-sm text-gray-400">${emptyMsg}</div>`;
        return;
      }

      container.innerHTML = list.map((t, idx) => {
        const urgBadge = t.urgency === "Urgent" ? "bg-red-600 text-white"
                       : t.urgency === "High" ? "bg-orange-500 text-white"
                       : t.urgency === "Normal" ? "bg-emerald-100 text-emerald-900"
                       : "bg-gray-200 text-gray-700";

        const statBadge = t.status === "In progress" ? "bg-amber-100 text-amber-800"
                        : t.status === "Waiting" ? "bg-purple-100 text-purple-800"
                        : t.status === "Resolved" ? "bg-emerald-100 text-emerald-800"
                        : "bg-blue-100 text-blue-800";

        return `
          <div class="bg-white p-5 rounded-xl border ${idx === 0 && activeTab === 'my' ? 'border-2 border-emerald-600' : 'border-gray-200'} shadow-sm space-y-3">
            
            <!-- Top Badges -->
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold px-2.5 py-0.5 rounded ${urgBadge}">
                  ${activeTab === 'my' ? `PRIORITY #${idx + 1} • ` : ''}${t.urgency.toUpperCase()}
                </span>
                <span class="text-xs font-bold text-gray-800">#${t.id}</span>
              </div>
              <span class="text-xs font-semibold px-2.5 py-0.5 rounded ${statBadge}">${t.status}</span>
            </div>

            <!-- Category & Details -->
            <div>
              <p class="text-sm font-bold text-emerald-900">${t.type} ${t.subCategory ? `(${t.subCategory})` : ''}</p>
              <p class="text-sm text-gray-800 bg-gray-50 p-3 rounded-lg border mt-1.5">${t.details}</p>
              ${t.imageUrl ? `<a href="${t.imageUrl}" target="_blank" class="inline-block mt-2 text-xs font-bold text-blue-600 underline bg-blue-50 px-2 py-1 rounded border border-blue-200">🖼️ View Attached Image</a>` : ""}
              ${t.resolutionNote ? `<p class="text-xs text-emerald-800 bg-emerald-50 p-2 rounded mt-1.5">✅ <b>Resolution Note:</b> ${t.resolutionNote}</p>` : ''}
            </div>

            <!-- Requester Info & Action Buttons -->
            <div class="pt-2 border-t border-gray-100 flex flex-wrap justify-between items-center gap-2 text-xs">
              <div class="text-gray-500">
                👤 Staff: <b class="text-gray-800">${t.name}</b> 
                • <a href="https://wa.me/${t.phone}" target="_blank" class="text-emerald-700 font-semibold underline">💬 Chat Staff</a>
                <div class="text-[11px] text-gray-400 mt-0.5">Submitted: ${t.createdAt}</div>
              </div>

              <!-- Action Buttons Based on Tab -->
              <div class="flex flex-wrap gap-1.5">
                ${activeTab === "pool" ? `
                  <button onclick="selfClaimTask('${t.id}')" class="bg-emerald-800 hover:bg-emerald-900 text-white font-semibold px-3 py-2 rounded-lg transition">
                    🙋‍♂️ Claim This Task
                  </button>
                ` : ""}

                ${activeTab === "my" ? `
                  ${t.status !== "Waiting" ? `
                    <button onclick="holdTask('${t.id}')" class="bg-purple-100 hover:bg-purple-200 text-purple-800 font-semibold px-2.5 py-2 rounded-lg transition" title="Waiting for spare part or user">
                      ⏸️ Hold (Free Me Up)
                    </button>
                  ` : `
                    <button onclick="resumeTask('${t.id}')" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-2.5 py-2 rounded-lg transition">
                      ▶️ Resume Task
                    </button>
                  `}
                  <button onclick="completeTask('${t.id}')" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold px-3 py-2 rounded-lg transition">
                    ✅ Complete Task
                  </button>
                ` : ""}
              </div>
            </div>

          </div>
        `;
      }).join("");
    }

    // ACTION 1: Self-Claim a task from Open Queue -> Sets tech to Busy & assigns ticket
    async function selfClaimTask(ticketId) {
      const t = allTickets.find(x => x.id === ticketId);
      await Promise.all([
        dbFetch(`/tickets/${ticketId}/assignedTo.json`, { method: "PUT", body: JSON.stringify(currentTech.name) }),
        dbFetch(`/tickets/${ticketId}/assignedPhone.json`, { method: "PUT", body: JSON.stringify(currentTech.phone) }),
        dbFetch(`/tickets/${ticketId}/status.json`, { method: "PUT", body: JSON.stringify("In progress") }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/availability.json`, { method: "PUT", body: JSON.stringify("Busy") }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/statusNote.json`, { method: "PUT", body: JSON.stringify(`Working on #${ticketId} (${t ? t.name : ''})`) })
      ]);
      switchTab('my');
      syncWorkspace();
    }

    // ACTION 2: Put Task on Hold (e.g. Waiting for spare part) -> Frees up tech back to Available!
    async function holdTask(ticketId) {
      const reason = prompt("Reason for holding task (e.g., Waiting for spare part / Waiting for supplier):", "Waiting for spare part");
      if (reason === null) return;

      await Promise.all([
        dbFetch(`/tickets/${ticketId}/status.json`, { method: "PUT", body: JSON.stringify("Waiting") }),
        dbFetch(`/tickets/${ticketId}/resolutionNote.json`, { method: "PUT", body: JSON.stringify("ON HOLD: " + reason) }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/availability.json`, { method: "PUT", body: JSON.stringify("Available") }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/statusNote.json`, { method: "PUT", body: JSON.stringify(`Available (#${ticketId} on hold)`) })
      ]);
      syncWorkspace();
    }

    // ACTION 3: Resume a Held Task -> Sets tech back to Busy
    async function resumeTask(ticketId) {
      await Promise.all([
        dbFetch(`/tickets/${ticketId}/status.json`, { method: "PUT", body: JSON.stringify("In progress") }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/availability.json`, { method: "PUT", body: JSON.stringify("Busy") }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/statusNote.json`, { method: "PUT", body: JSON.stringify(`Resumed #${ticketId}`) })
      ]);
      syncWorkspace();
    }

    // ACTION 4: Complete Task -> Resolves ticket & automatically sets tech back to Available (if no other active tasks)
    async function completeTask(ticketId) {
      const note = prompt("Optional: Enter a quick resolution note (e.g. Replaced cable / Reinstalled driver):", "Issue resolved");
      if (note === null) return; // Cancelled

      const resolvedTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const remainingActive = allTickets.filter(t =>
        t.id !== ticketId &&
        t.assignedTo &&
        t.assignedTo.toLowerCase() === currentTech.name.toLowerCase() &&
        t.status === "In progress"
      );

      // If tech still has another active 'In progress' task, keep them Busy; otherwise set them back to Available!
      const nextAvailability = remainingActive.length > 0 ? "Busy" : "Available";
      const nextNote = remainingActive.length > 0
        ? `Working on #${remainingActive[0].id}`
        : `Ready (Just finished #${ticketId})`;

      await Promise.all([
        dbFetch(`/tickets/${ticketId}/status.json`, { method: "PUT", body: JSON.stringify("Resolved") }),
        dbFetch(`/tickets/${ticketId}/resolvedAt.json`, { method: "PUT", body: JSON.stringify(resolvedTime) }),
        dbFetch(`/tickets/${ticketId}/resolutionNote.json`, { method: "PUT", body: JSON.stringify(note || "Completed") }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/availability.json`, { method: "PUT", body: JSON.stringify(nextAvailability) }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/statusNote.json`, { method: "PUT", body: JSON.stringify(nextNote) }),
        dbFetch(`/onsiteTeam/${currentTech.phone}/completedToday.json`, { method: "PUT", body: JSON.stringify((currentTech.completedToday || 0) + 1) })
      ]);

      syncWorkspace();
    }

    function signOut() {
      localStorage.removeItem("techSession");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
